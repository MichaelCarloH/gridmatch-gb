[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmatch-gb"
version = "0.1.0"
description = "Great Britain clean-power forecasting and matching prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.29",
  "holidays>=0.60",
  "joblib>=1.4",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyproj>=3.6",
  "pydantic>=2.7",
  "requests>=2.31",
  "scikit-learn>=1.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
